<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>woki</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="woki-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="woki-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="shortcut icon" href="favicon.ico" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #181818;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      #status {
        position: fixed;
        right: 8px;
        bottom: 8px;
        color: #888;
        font: 10px monospace;
      }

      #support {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      #support[hidden] {
        display: none;
      }

      .support-box {
        width: min(32rem, 100%);
        color: #eee;
        font: 16px/1.5 system-ui, sans-serif;
        text-align: center;
      }

      .support-icon {
        display: block;
        width: min(220px, 36vw);
        height: auto;
        margin: 0 auto 24px;
      }

      .support-box h1 {
        margin: 0 0 16px;
        font-size: 1.125rem;
        font-weight: 600;
      }

      .support-box p {
        margin: 0 0 10px;
        color: #bbb;
      }

      .support-box p:last-of-type {
        margin-bottom: 0;
      }

      .support-box a {
        color: #8ec5ff;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading…</div>

    <div id="support" hidden>
      <div class="support-box">
        <img class="support-icon" src="woki-sad.svg" alt="" />
        <h1 id="support-title"></h1>
        <p id="support-line-1"></p>
        <p id="support-line-2"></p>
        <p id="support-line-3"></p>
        <p>
          <a href="https://developer.mozilla.org/en-US/docs/Web/API/WebGPU_API" target="_blank" rel="noreferrer">
            MDN WebGPU documentation
          </a>
        </p>
      </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
      const canvas = document.getElementById('canvas');
      const status = document.getElementById('status');
      const support = document.getElementById('support');
      const supportTitle = document.getElementById('support-title');
      const supportLines = [
        document.getElementById('support-line-1'),
        document.getElementById('support-line-2'),
        document.getElementById('support-line-3'),
      ];

      function removeWokiInput() {
        if (Module.wokiInputAbort) {
          Module.wokiInputAbort.abort();
          Module.wokiInputAbort = null;
        }
      }

      function installWokiInput() {
        removeWokiInput();
        const controller = new AbortController();
        const options = { capture: true, passive: false, signal: controller.signal };
        const positions = new Map();
        Module.wokiInputAbort = controller;

        const pointerKind = (value) => value === 'mouse' ? 1 : value === 'touch' ? 2 : value === 'pen' ? 3 : 0;
        const pointerButton = (value) => value < 0 ? -1 : value === 0 ? 0 : value === 1 ? 2 : value === 2 ? 1 : value;
        const modifiers = (event) => (event.shiftKey ? 1 : 0) | (event.ctrlKey ? 2 : 0) | (event.altKey ? 4 : 0) | (event.metaKey ? 8 : 0);
        const point = (event) => {
          const rect = canvas.getBoundingClientRect();
          return [event.clientX - rect.left, event.clientY - rect.top];
        };
        const sendPointer = (phase, event) => {
          const position = point(event);
          const previous = positions.get(event.pointerId) || position;
          Module._woki_web_pointer_event(
            phase, pointerKind(event.pointerType), event.pointerId, event.isPrimary ? 1 : 0,
            pointerButton(event.button), event.buttons, position[0], position[1],
            position[0] - previous[0], position[1] - previous[1], event.pressure || 0,
            event.width || 0, event.height || 0, event.tiltX || 0, event.tiltY || 0, event.twist || 0, modifiers(event),
          );
          if (phase === 2 || phase === 3 || phase === 5) positions.delete(event.pointerId);
          else positions.set(event.pointerId, position);
          event.preventDefault();
        };
        canvas.addEventListener('pointerdown', (event) => { canvas.setPointerCapture(event.pointerId); sendPointer(0, event); }, options);
        canvas.addEventListener('pointermove', (event) => sendPointer(1, event), options);
        canvas.addEventListener('pointerup', (event) => sendPointer(2, event), options);
        canvas.addEventListener('pointercancel', (event) => sendPointer(3, event), options);
        canvas.addEventListener('pointerenter', (event) => sendPointer(4, event), options);
        canvas.addEventListener('pointerleave', (event) => sendPointer(5, event), options);
        canvas.addEventListener('lostpointercapture', (event) => { if (positions.has(event.pointerId)) sendPointer(3, event); }, options);
        canvas.addEventListener('wheel', (event) => {
          const position = point(event);
          const unit = event.deltaMode === WheelEvent.DOM_DELTA_PIXEL ? 0 : event.deltaMode === WheelEvent.DOM_DELTA_LINE ? 1 : 2;
          if (event.ctrlKey && unit === 0) Module._woki_web_magnify_event(Math.exp(-event.deltaY * 0.01), position[0], position[1]);
          else Module._woki_web_scroll_event(event.deltaX, event.deltaY, unit, unit === 0 ? 1 : 0, position[0], position[1], modifiers(event));
          event.preventDefault();
        }, options);
        const sendComposition = (phase, event) => {
          const value = event.data || '';
          const size = lengthBytesUTF8(value) + 1;
          const pointer = Module._malloc(size);
          stringToUTF8(value, pointer, size);
          Module._woki_web_composition_event(phase, pointer);
          Module._free(pointer);
        };
        canvas.addEventListener('compositionstart', (event) => sendComposition(0, event), options);
        canvas.addEventListener('compositionupdate', (event) => sendComposition(1, event), options);
        canvas.addEventListener('compositionend', (event) => sendComposition(2, event), options);
      }

      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.floor(window.innerWidth * dpr));
        canvas.height = Math.max(1, Math.floor(window.innerHeight * dpr));
      }

      function showSupport(title, lines) {
        supportTitle.textContent = title;

        supportLines.forEach((element, index) => {
          const text = lines[index] || '';
          element.textContent = text;
          element.hidden = text.length === 0;
        });

        support.hidden = false;
        status.textContent = 'WebGPU unavailable';
      }

      function showWebGpuUnavailable() {
        showSupport('WebGPU is not available in this browser.', [
          'The studio could not start.',
          'Use a browser with WebGPU support, or enable it in about:config.',
        ]);
      }

      async function detectWebGpuSupport() {
        if (!('gpu' in navigator)) {
          showWebGpuUnavailable();
          return;
        }

        try {
          const adapter = await navigator.gpu.requestAdapter();
          if (!adapter) {
            showSupport('No GPU adapter found.', [
              'This browser exposes WebGPU, but no adapter is available.',
              'Check browser flags, drivers, and secure-context requirements.',
            ]);
          }
        } catch (error) {
          showWebGpuUnavailable();
        }
      }

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      detectWebGpuSupport();

      var Module = {
        canvas: canvas,
        installWokiInput: installWokiInput,
        removeWokiInput: removeWokiInput,
        onAbort: function () {
          showWebGpuUnavailable();
        },
        onRuntimeInitialized: function () {
          resizeCanvas();
          support.hidden = true;
          status.textContent = 'Running';
        },
      };
    </script>

    {{{ SCRIPT }}}
  </body>
</html>
