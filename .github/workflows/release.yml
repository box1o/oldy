name: Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  native:
    uses: ./.github/workflows/native.yml
    with:
      package: true

  publish:
    name: Publish
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^project\(woki VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          if [[ -z "$version" ]]; then
            echo "Unable to read the project version from CMakeLists.txt" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Ensure version is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Increase the project version before pushing to release." >&2
            exit 1
          fi

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: packages

      - name: Create archives
        shell: bash
        run: |
          mkdir -p artifacts
          tar -czf artifacts/woki-linux-x64.tar.gz -C packages/woki-linux-x64 .
          tar -czf artifacts/woki-macos-arm64.tar.gz -C packages/woki-macos-arm64 .
          (cd packages/woki-windows-x64 && zip -qr "../../artifacts/woki-windows-x64.zip" .)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Woki $TAG" \
            --generate-notes
